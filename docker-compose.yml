services:
  gateway:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  user-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: user_svc_pw
      POSTGRES_DB: users
    ports:
      - "54321:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_svc -d users"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      DATABASE_URL: postgres://user_svc:user_svc_pw@user-db:5432/users
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      user-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-service.rule=PathPrefix(`/api/users`)"
      - "traefik.http.routers.user-service.middlewares=user-strip"
      - "traefik.http.middlewares.user-strip.stripprefix.prefixes=/api/users"
      - "traefik.http.services.user-service.loadbalancer.server.port=8081"

  product-db:
    image: postgres:16
    environment:
      POSTGRES_USER: product_svc
      POSTGRES_PASSWORD: product_svc_pw
      POSTGRES_DB: products
    ports:
      - "54322:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_svc -d products"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    environment:
      DATABASE_URL: postgres://product_svc:product_svc_pw@product-db:5432/products
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      product-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.product-service.rule=PathPrefix(`/api/products`)"
      - "traefik.http.routers.product-service.middlewares=product-strip"
      - "traefik.http.middlewares.product-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.product-service.loadbalancer.server.port=8082"

  cart-redis:
    image: redis:7-alpine
    volumes:
      - cart_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    environment:
      REDIS_URL: redis://cart-redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      cart-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cart-service.rule=PathPrefix(`/api/cart`)"
      - "traefik.http.routers.cart-service.middlewares=cart-strip"
      - "traefik.http.middlewares.cart-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.cart-service.loadbalancer.server.port=8083"

  order-db:
    image: postgres:16
    environment:
      POSTGRES_USER: order_svc
      POSTGRES_PASSWORD: order_svc_pw
      POSTGRES_DB: orders
    ports:
      - "54324:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_svc -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      DATABASE_URL: postgres://order_svc:order_svc_pw@order-db:5432/orders
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    depends_on:
      order-db:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      cart-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.order-service.rule=PathPrefix(`/api/orders`)"
      - "traefik.http.routers.order-service.middlewares=order-strip"
      - "traefik.http.middlewares.order-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.order-service.loadbalancer.server.port=8084"

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_USER: payment_svc
      POSTGRES_PASSWORD: payment_svc_pw
      POSTGRES_DB: payments
    ports:
      - "54325:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_svc -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgres://payment_svc:payment_svc_pw@payment-db:5432/payments
      SAFEPAY_API_KEY: ${SAFEPAY_API_KEY}
      SAFEPAY_MERCHANT_SECRET: ${SAFEPAY_MERCHANT_SECRET}
      SAFEPAY_WEBHOOK_SECRET: ${SAFEPAY_WEBHOOK_SECRET}
      SAFEPAY_ENV: sandbox
      ORDER_SERVICE_URL: http://order-service:8084
    depends_on:
      payment-db:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}

volumes:
  user_db_data:
  product_db_data:
  cart_redis_data:
  order_db_data:
  payment_db_data: